name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: funpay
          POSTGRES_PASSWORD: funpay
          POSTGRES_DB: funpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U funpay -d funpay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://funpay:funpay@localhost:5432/funpay
      TEST_DATABASE_URL: postgresql+asyncpg://funpay:funpay@localhost:5432/funpay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Build docs
        run: mkdocs build --strict

      - name: Test
        run: pytest

      - name: Build Docker image
        run: docker build .
