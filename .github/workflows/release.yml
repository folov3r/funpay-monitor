name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: funpay-monitor-windows
          - os: ubuntu-22.04
            artifact: funpay-monitor-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      # `build_core.py` embeds `frontend/dist`, so the npm dependencies must be
      # installed before it runs.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Python sidecar
        run: python scripts/build_core.py

      - name: Build Windows installers
        if: runner.os == 'Windows'
        working-directory: frontend
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles msi,nsis

      - name: Build Linux installers
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles deb,appimage

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # `download-artifact` keeps the bundle directory of each artifact, so the
      # installers live at `artifacts/<artifact>/<bundle>/<file>`.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers found in artifacts" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FunPay Monitor $GITHUB_REF_NAME" \
              --generate-notes \
              "${files[@]}"
          fi
