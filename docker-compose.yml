name: funpay-monitor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funpay}
      POSTGRES_DB: ${POSTGRES_DB:-funpay}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funpay} -d ${POSTGRES_DB:-funpay}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    command: python -m app.main
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-funpay}:${POSTGRES_PASSWORD:-funpay}@db:5432/${POSTGRES_DB:-funpay}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-funpay}:${POSTGRES_PASSWORD:-funpay}@db:5432/${POSTGRES_DB:-funpay}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
