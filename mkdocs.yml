site_name: FunPay Monitor
site_description: Настольное приложение для мониторинга цен на FunPay
docs_dir: docs
theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
nav:
  - Обзор: index.md
  - Десктоп-приложение: desktop.md
  - "VK-бот: быстрый старт": quickstart.md
  - Архитектура VK-бота: architecture.md
  - Модель данных: data-model.md
  - Парсер FunPay: parser.md
  - Воркер VK-бота: worker.md
  - Команды VK-бота: bot.md
  - Алерты: alerts.md
  - Тестирование: testing.md
  - Развёртывание VK-бота: deployment.md
  - Ограничения: limitations.md
  - Презентация: presentation.md
  - QA-чеклист: qa-checklist.md
  - Changelog: changelog.md
